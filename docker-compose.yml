name: tafi

# Local development stack: api + db + redis + worker + web.
#   cp .env.example .env && docker compose up --build
# The production stack (TLS, no bind mounts, Nginx/Caddy) is Sprint 7 work.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tafi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tafi}
      POSTGRES_DB: ${POSTGRES_DB:-tafi}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tafi} -d ${POSTGRES_DB:-tafi}"]
      interval: 5s
      timeout: 5s
      retries: 12
      # First run initialises the cluster (initdb), which outlasts the retries
      # above on a cold machine. Failures during the grace period are ignored.
      start_period: 60s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build:
      context: ./backend
      target: dev
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-tafi}:${POSTGRES_PASSWORD:-tafi}@db:5432/${POSTGRES_DB:-tafi}
      REDIS_URL: redis://redis:6379/0
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request as u; u.urlopen('http://localhost:8000/health')\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    build:
      context: ./backend
      target: dev
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-tafi}:${POSTGRES_PASSWORD:-tafi}@db:5432/${POSTGRES_DB:-tafi}
      REDIS_URL: redis://redis:6379/0
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--beat", "--loglevel=info"]
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      target: dev
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api

volumes:
  db_data:
  redis_data:

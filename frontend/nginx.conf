server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # This directory holds the raw wireframe HTML, but /wireframes is also a React route.
    location = /wireframes {
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
